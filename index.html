<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roots — the Carter family tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eee3;--surface:#fffdf8;--surface2:#f8f3ea;--ink:#2a231e;--muted:#7a6d61;--line:#e4d9c6;
  --bark:#6b4e39;--bark2:#86654c;--accent:#2f6b4f;--accent-soft:#e1efe6;--accent-ink:#fff;
  --warm:#c8553d;--ground:#c9d6a8;--ground2:#b5c792;--label:#fffdf8;--shadow:0 10px 30px rgba(60,40,20,.12);
  --sky:radial-gradient(1200px 600px at 50% 15%,#fbf8f1 0%,#f3eee3 60%,#ece4d4 100%);
}
[data-theme=dark]{
  --bg:#13180f;--surface:#1c2219;--surface2:#232a20;--ink:#ece6d9;--muted:#a59c8e;--line:#323a2d;
  --bark:#8a6a52;--bark2:#a07f63;--accent:#86c9a2;--accent-soft:#24382c;--accent-ink:#10170f;
  --warm:#e07a5f;--ground:#2c3a24;--ground2:#24311e;--label:#232a20;--shadow:0 10px 30px rgba(0,0,0,.45);
  --sky:radial-gradient(1200px 600px at 50% 15%,#1d2519 0%,#151b12 60%,#10140d 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.brand svg{width:30px;height:30px}
.brand b{font-family:Fraunces,serif;font-weight:600;font-size:21px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px;display:block;margin-top:-2px}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grow{flex:1}
.search{position:relative}
.search input{width:220px;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sugg{position:absolute;top:110%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;text-align:left}
.sugg button:hover,.sugg button.hi{background:var(--surface2)}
.sugg img,.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ctl select{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 10px}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.ibtn:hover{border-color:var(--accent)}
.badge[hidden],.citem .cnt[hidden]{display:none!important}
.badge{position:absolute;top:-4px;right:-4px;background:var(--warm);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.stage{position:relative;overflow:hidden;background:var(--sky)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg:active{cursor:grabbing}
.branch{fill:none;stroke:var(--bark);stroke-linecap:round}
.chartlink{fill:none;stroke:var(--line);stroke-width:2.5}
[data-theme=dark] .chartlink{stroke:#45503e}
.trunk{fill:var(--bark)}
.person{cursor:pointer;transition:opacity .3s}
.person .ring{fill:var(--surface);stroke:var(--surface);stroke-width:3}
.person .halo{fill:none;stroke:transparent;stroke-width:3}
.person:hover .halo,.person:focus .halo{stroke:var(--accent);stroke-opacity:.5}
.person.sel .halo{stroke:var(--accent);stroke-opacity:1}
.person.me .ring{stroke:var(--accent)}
.person.pending image{opacity:.75}
.person.pending .ring{stroke:var(--muted);stroke-dasharray:4 4}
.person:focus{outline:none}
.lbl rect{fill:var(--label);stroke:var(--line)}
.lbl text{fill:var(--ink);font-size:13px;font-weight:500;text-anchor:middle}
.lbl text.sub{fill:var(--muted);font-size:10.5px;font-weight:500}
.ub circle{fill:var(--warm);stroke:var(--surface);stroke-width:2}
.ub text{fill:#fff;font-size:11px;font-weight:600;text-anchor:middle}
.tog circle{fill:var(--surface);stroke:var(--bark2);stroke-width:1.5}
.tog text{fill:var(--bark);font-size:12px;font-weight:600;text-anchor:middle}
.tog{cursor:pointer}
.dim{opacity:.16}
.couple-link{stroke:var(--bark2);stroke-width:2;stroke-dasharray:2 4}
.fab{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fab .row{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);width:40px}
.zoom button{border:0;background:none;height:38px;font-size:18px}
.zoom button+button{border-top:1px solid var(--line)}
.credit{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--muted);z-index:2;background:color-mix(in srgb,var(--surface) 70%,transparent);padding:3px 8px;border-radius:8px}
.credit a{color:inherit}
/* list */
#list{position:absolute;inset:0;overflow:auto;padding:24px;display:none}
#list h3{font-family:Fraunces,serif;font-weight:500;font-size:18px;margin:22px 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card img,.card .av{width:52px;height:52px;border-radius:50%;object-fit:cover}
.card b{display:block}
.card small{color:var(--muted)}
/* panel */
.panel{position:absolute;top:16px;right:16px;width:330px;max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transform:translateX(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:4}
.panel.open{transform:none}
.ph{position:relative;height:150px;background:linear-gradient(160deg,var(--accent-soft),var(--surface2))}
.ph .big{position:absolute;left:22px;bottom:-44px;width:104px;height:104px;border-radius:50%;object-fit:cover;border:5px solid var(--surface);background:var(--surface2)}
.ph .av.big{font-size:30px;display:flex}
.x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center}
.pb{padding:54px 22px 22px}
.pb h2{font-family:Fraunces,serif;font-weight:600;font-size:24px;margin:0 0 6px}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.chip.grey{background:var(--surface2);color:var(--muted)}
.facts{list-style:none;padding:0;margin:16px 0;display:grid;gap:9px;color:var(--muted);font-size:14px}
.facts li{display:flex;gap:10px;align-items:center}
.facts svg{flex:none}
.facts a{color:var(--accent);font-weight:500}
.bio{font-size:14px;line-height:1.55;margin:0 0 16px}
.btns{display:grid;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:10px 14px;border-radius:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(1.04)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
/* chat */
.drawer{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-family:Fraunces,serif;font-weight:600;font-size:19px;flex:1}
.dh .x{position:static;background:var(--surface2)}
.clist{overflow:auto;flex:1}
.citem{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.citem:hover{background:var(--surface2)}
.citem .meta{flex:1;min-width:0}
.citem b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.citem b small{color:var(--muted);font-weight:400;font-size:12px}
.citem .last{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.citem .cnt{background:var(--warm);color:#fff;font-size:11px;font-weight:600;border-radius:9px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.gav{width:42px;height:42px;position:relative;flex:none}
.gav img,.gav .av{position:absolute;width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--surface)}
.gav>*:first-child{left:0;top:0}.gav>*:nth-child(2){right:0;bottom:0}
.single img,.single .av{width:42px;height:42px;border-radius:50%;object-fit:cover}
.thread{display:none;flex-direction:column;flex:1;min-height:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.m{max-width:78%;display:flex;gap:8px;align-items:flex-end}
.m .bub{padding:9px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);line-height:1.4;font-size:14.5px}
.m small{display:block;color:var(--muted);font-size:11px;margin:0 4px 2px}
.m img,.m .av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .bub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day{align-self:center;font-size:11.5px;color:var(--muted);margin:8px 0}
.typing{font-size:12.5px;color:var(--muted);padding:0 16px 6px;background:var(--surface2);min-height:20px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:10px 14px;outline:none}
.compose input:focus{border-color:var(--accent)}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
.scrim.on{opacity:1;pointer-events:auto}
/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(20,15,10,.4);padding:16px}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:22px;width:420px;max-width:100%;padding:22px;box-shadow:var(--shadow);max-height:100%;overflow:auto}
.mbox h3{font-family:Fraunces,serif;font-weight:600;font-size:21px;margin:0 0 4px}
.mbox p{color:var(--muted);margin:0 0 16px;font-size:14px}
.f{display:grid;gap:5px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;outline:none;width:100%}
.f input:focus,.f select:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warm);font-size:13px;min-height:18px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
  header{gap:8px;padding:8px 10px}
  .brand span{display:none}
  .search input{width:150px}
  .ctl .lab{display:none}
  .ph{height:96px}.ph .big{width:84px;height:84px;bottom:-36px}.pb{padding-top:44px}
  .panel{top:auto;bottom:0;right:0;left:0;width:auto;max-height:64%;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .credit{display:none}
}
@media (max-width:560px){
  .tabs{order:10;width:100%;justify-content:center}
  .search{flex:1}.search input{width:100%}
  .grow{display:none}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="12" r="10" fill="#5f9c6f"/><circle cx="10" cy="14" r="6" fill="#4a8a5c"/><circle cx="22" cy="14" r="6" fill="#4a8a5c"/><path d="M16 30V14M16 20l-5-5M16 18l5-4" stroke="#6b4e39" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
    <div><b>Roots</b><span>The Carter family</span></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Layout">
    <button data-view="tree" class="on" role="tab">Tree</button>
    <button data-view="chart" role="tab">Chart</button>
    <button data-view="list" role="tab">List</button>
  </div>
  <div class="grow"></div>
  <div class="search">
    <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Find a relative" autocomplete="off" aria-label="Find a relative">
    <div class="sugg" id="sugg"></div>
  </div>
  <label class="ctl"><span class="lab">Viewing as</span><select id="viewer" aria-label="Viewing as"></select></label>
  <label class="ctl"><select id="season" aria-label="Season">
    <option value="spring">Spring</option><option value="summer" selected>Summer</option><option value="autumn">Autumn</option><option value="winter">Winter</option></select></label>
  <button class="ibtn" id="themeBtn" aria-label="Toggle dark mode" title="Dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="ibtn" id="msgBtn" aria-label="Messages" title="Messages"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="badge" id="msgBadge" hidden></span></button>
</header>

<div class="stage" id="stage">
  <svg id="svg" role="img" aria-label="Family tree"><defs><clipPath id="clipR"><circle r="30"/></clipPath></defs><g id="world"></g></svg>
  <div id="list"></div>
  <div class="fab">
    <div class="row">
      <button class="pill" id="meBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Center on me</button>
      <button class="pill" id="focusBtn" aria-pressed="false">My line only</button>
    </div>
    <div class="zoom" id="zoomCtl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit tree" style="font-size:14px">⤢</button></div>
  </div>
  <div class="credit">Demo data · faces are AI-generated (<a href="https://generated.photos" target="_blank" rel="noopener">Generated Photos</a>)</div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Messages">
  <div id="dList" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="dh"><h3>Messages</h3><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="clist" id="clist"></div>
  </div>
  <div class="thread" id="thread">
    <div class="dh" id="thHead"></div>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing"></div>
    <form class="compose" id="compose"><input id="msgIn" placeholder="Write a message" autocomplete="off" aria-label="Message"><button class="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>
  </div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="mbox" id="addForm" novalidate>
    <h3 id="mTitle">Add a relative</h3>
    <p id="mSub"></p>
    <div class="f"><label for="aRel">Relationship</label><select id="aRel"></select></div>
    <div class="two">
      <div class="f"><label for="aFirst">First name</label><input id="aFirst" placeholder="Ada"></div>
      <div class="f"><label for="aLast">Last name</label><input id="aLast"></div>
    </div>
    <div class="two">
      <div class="f"><label for="aG">Gender</label><select id="aG"><option value="x" selected>Prefer not to say</option><option value="f">Female</option><option value="m">Male</option></select></div>
      <div class="f"><label for="aBorn">Birth year</label><input id="aBorn" inputmode="numeric" placeholder="1990"></div>
    </div>
    <div class="f"><label for="aPlace">Lives in</label><input id="aPlace" placeholder="Sheffield"></div>
    <div class="f"><label for="aPhoto">Photo (optional)</label><input id="aPhoto" type="file" accept="image/*"></div>
    <div class="err" id="aErr"></div>
    <div class="mact"><button type="button" class="btn" id="aCancel">Cancel</button><button class="btn primary">Add to tree</button></div>
  </form>
</div>

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
function ancestors(id){const m=new Map([[id,0]]),q=[id];while(q.length){const c=q.shift();for(const p of P[c].parents)if(!m.has(p)){m.set(p,m.get(c)+1);q.push(p);}}return m;}
function blood(a,b){const A=ancestors(a),B=ancestors(b);let best=null;for(const[k,da]of A)if(B.has(k)){const db=B.get(k);if(!best||da+db<best[0]+best[1])best=[da,db];}return best;}
const ord=n=>['first','second','third','fourth','fifth'][n-1]||n+'th';
function kin(up,down,g){
 if(!up&&!down)return 'you';
 if(!down)return up===1?W(g,'father','mother','parent'):'great-'.repeat(up-2)+W(g,'grandfather','grandmother','grandparent');
 if(!up)return down===1?W(g,'son','daughter','child'):'great-'.repeat(down-2)+W(g,'grandson','granddaughter','grandchild');
 if(up===1&&down===1)return W(g,'brother','sister','sibling');
 if(down===1)return 'great-'.repeat(up-2)+W(g,'uncle','aunt','aunt or uncle');
 if(up===1)return 'great-'.repeat(down-2)+W(g,'nephew','niece','nibling');
 const deg=Math.min(up,down)-1,rem=Math.abs(up-down);
 return ord(deg)+' cousin'+(rem?` ${rem===1?'once':rem===2?'twice':rem+' times'} removed`:'');
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function relation(v,t){
 if(v===t)return 'You';
 const g=P[t].g,vs=P[v].spouse,ts=P[t].spouse;
 if(vs===t)return W(g,'Husband','Wife','Spouse');
 const b=blood(v,t);if(b)return cap(kin(b[0],b[1],g));
 if(ts){const b2=blood(v,ts);if(b2){const[u,d]=b2;
   if(!u&&d===1)return W(g,'Son-in-law','Daughter-in-law','Child-in-law');
   if(u===1&&d===1)return W(g,'Brother-in-law','Sister-in-law','Sibling-in-law');
   if(d===1&&u>=2)return cap(kin(u,d,g))+' by marriage';}}
 if(vs){const b3=blood(vs,t);if(b3){const[u,d]=b3;
   if(u===1&&!d)return W(g,'Father-in-law','Mother-in-law','Parent-in-law');
   if(u===1&&d===1)return W(g,'Brother-in-law','Sister-in-law','Sibling-in-law');
   return `${first(vs)}’s ${kin(u,d,g)}`;}}
 if(ts)return `${first(ts)}’s ${W(g,'husband','wife','partner')}`;
 return 'Family';
}
function branchOf(id){
 let b=P[id].parents.length?id:(P[id].spouse&&P[P[id].spouse].parents.length?P[id].spouse:null);
 if(!b)return 'Founders';
 while(P[b].parents.length&&!P[b].parents.includes(ROOT))b=P[b].parents[0];
 return `${first(b)}’s branch`;
}
function directLine(v){
 const set=new Set([v]);if(P[v].spouse)set.add(P[v].spouse);
 const blood=P[v].parents.length||!P[v].spouse?v:P[v].spouse;
 for(const a of ancestors(blood).keys()){set.add(a);if(P[a].spouse)set.add(P[a].spouse);}
 const st=[blood];while(st.length){const c=st.pop();for(const k of kids(c)){set.add(k);if(P[k].spouse)set.add(P[k].spouse);st.push(k);}}
 return set;
}

function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}

  for(const s of[-1,1])gBack.append('path').attr('class','branch').attr('stroke-width',7).attr('d',`M${s*tr*1.6},${TB} q${s*40},4 ${s*90},18`);

  gBack.append('path').attr('class','branch').attr('stroke','var(--bark2)').attr('stroke-width',2).attr('stroke-opacity',.5).attr('d',`M${tr*.4},70 C${tr*.5},130 ${tr*.7},180 ${tr},${TB-10}`);
 }

    .attr('d',`M${s.X},${s.Y} C${s.X},${s.Y-LEVEL*.55} ${t.X},${t.Y+LEVEL*.5} ${t.X},${t.Y}`);

 });

   for(let i=0;i<n;i++)pts.push([d.X+(r()-.5)*spread*2,d.Y-10+(r()-.6)*spread*1.3]);

     .attr('transform',`translate(${x},${y}) rotate(${r()*360}) scale(${.9+r()*.8})`));
  });
 }

 root.descendants().forEach(d=>{

function countAll(n){return 1+(n.spouse?1:0)+n.kids.reduce((a,k)=>a+countAll(k),0);}

function convTitle(c){return c.type==='dm'?P[c.members.find(m=>m!==S.viewer)].name:c.title;}
function convAv(c){if(c.type==='dm'){const o=c.members.find(m=>m!==S.viewer);return `<span class="single">${avatar(o)}</span>`;}
 const ms=c.members.filter(m=>m!==S.viewer).slice(0,2);return `<span class="gav">${ms.map(m=>avatar(m)).join('')}</span>`;}
function myConvs(){return Object.values(convs).filter(c=>c.members.includes(S.viewer)&&(c.msgs.length||c.id===S.openConv||c.type==='group')).sort((a,b)=>(b.msgs.at(-1)?.t||0)-(a.msgs.at(-1)?.t||0));}
function renderConvList(){
 $('#clist').innerHTML=myConvs().map(c=>{const l=c.msgs.at(-1),u=U()[c.id]||0;
  return `<button class="citem" data-c="${c.id}">${convAv(c)}<span class="meta"><b><span>${esc(convTitle(c))}</span><small>${l?fmtT(l.t):''}</small></b><span class="last">${l?esc((l.from===S.viewer?'You':first(l.from))+': '+l.text):(c.members.length+' members')}</span></span>${u?`<span class="cnt">${u}</span>`:''}</button>`;}).join('')||'<p style="padding:16px;color:var(--muted)">No conversations yet. Tap someone on the tree to say hello.</p>';
}
$('#clist').addEventListener('click',e=>{const b=e.target.closest('.citem');if(b)openChat(b.dataset.c);});
function updateBadge(){const n=totalUnread(),b=$('#msgBadge');b.hidden=!n;b.textContent=n;}
function openDrawer(){$('#drawer').classList.add('open');$('#scrim').classList.add('on');}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('on');S.openConv=null;}
function showList(){S.openConv=null;$('#thread').style.display='none';$('#dList').style.display='flex';renderConvList();}
function openChat(cid){
 S.openConv=cid;openDrawer();
 $('#dList').style.display='none';$('#thread').style.display='flex';
 const c=convs[cid];delete U()[cid];updateBadge();refreshBadges();
 const sub=c.type==='dm'?relation(S.viewer,c.members.find(m=>m!==S.viewer)):`${c.members.length} members`;
 $('#thHead').innerHTML=`<button class="x" id="thBack" aria-label="Back" style="position:static;background:var(--surface2)">←</button>${convAv(c)}<div style="flex:1;min-width:0"><b style="display:block">${esc(convTitle(c))}</b><small style="color:var(--muted)">${esc(sub)}</small></div><button class="x" data-close aria-label="Close" style="position:static;background:var(--surface2)">✕</button>`;
 $('#thBack').onclick=showList;
 renderMsgs();$('#typing').textContent='';
 setTimeout(()=>$('#msgIn').focus(),250);
}
function renderMsgs(){
 const c=convs[S.openConv];let lastDay='';
 $('#msgs').innerHTML=c.msgs.map(m=>{const d=new Date(m.t).toDateString();const day=d!==lastDay?`<div class="day">${fmtT(m.t)==='Yesterday'?'Yesterday':new Date(m.t).toDateString()===new Date().toDateString()?'Today':new Date(m.t).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'})}</div>`:'';lastDay=d;
  const me=m.from===S.viewer;
  return day+`<div class="m${me?' me':''}">${me?'':avatar(m.from)}<div>${!me&&c.type==='group'?`<small>${esc(first(m.from))}</small>`:''}<div class="bub" title="${fmtT(m.t)}">${esc(m.text)}</div></div></div>`;}).join('')||`<div class="day">Say hello to ${esc(convTitle(c))}</div>`;
 $('#msgs').scrollTop=1e9;
}
$('#compose').addEventListener('submit',e=>{
 e.preventDefault();const v=$('#msgIn').value.trim();if(!v)return;
 const c=convs[S.openConv];c.msgs.push({from:S.viewer,text:v,t:Date.now()});$('#msgIn').value='';renderMsgs();
 const others=c.members.filter(m=>m!==S.viewer&&REPLIES[m]);if(!others.length)return;
 const who=others[Math.floor(Math.random()*others.length)],cid=c.id;
 setTimeout(()=>{if(S.openConv===cid)$('#typing').textContent=`${first(who)} is typing…`;},700);
 setTimeout(()=>{const pool=REPLIES[who];c.msgs.push({from:who,text:pool[Math.floor(Math.random()*pool.length)],t:Date.now()});
  if(S.openConv===cid){$('#typing').textContent='';renderMsgs();}else{U()[cid]=(U()[cid]||0)+1;updateBadge();refreshBadges();}
 },2200+Math.random()*1200);
});
$('#msgBtn').onclick=()=>{openDrawer();showList();};
$('#scrim').onclick=closeDrawer;
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeDrawer();});
function refreshBadges(){if(S.view!=='list'){const t=d3.zoomTransform(svg.node());render();svg.call(zoom.transform,t);}if(S.selected&&$('#panel').classList.contains('open')){const id=S.selected;const btn=$('#pMsg');if(btn){const u=unreadFrom(id);btn.innerHTML=`${ico.msg}Message ${esc(first(id))}${u?` (${u} new)`:''}`;}}}

/* ---------- add relative ---------- */
let addFor=null;
function openAdd(id){
 addFor=id;const p=P[id];
 const opts=[['child',`Child of ${first(id)}${p.spouse?' & '+first(p.spouse):''}`]];
 if(!p.spouse)opts.push(['spouse',`Partner of ${first(id)}`]);
 if(p.parents.length)opts.push(['sibling',`Sibling of ${first(id)}`]);
 $('#aRel').innerHTML=opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
 $('#mSub').textContent=`They’ll appear on the tree straight away. You can invite them once they’re added.`;
 $('#aFirst').value='';$('#aLast').value=p.name.split(' ').slice(1).join(' ');$('#aBorn').value='';$('#aPlace').value=p.place;$('#aPhoto').value='';$('#aErr').textContent='';
 $('#modal').classList.add('on');setTimeout(()=>$('#aFirst').focus(),50);
}
$('#aCancel').onclick=()=>$('#modal').classList.remove('on');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');});
['aFirst','aBorn'].forEach(i=>$('#'+i).addEventListener('input',()=>$('#aErr').textContent=''));
$('#addForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const fn=$('#aFirst').value.trim(),ln=$('#aLast').value.trim(),born=+$('#aBorn').value,rel=$('#aRel').value,yr=new Date().getFullYear();
 if(!fn){$('#aErr').textContent='Enter a first name.';$('#aFirst').focus();return;}
 if(!born||born<1880||born>yr){$('#aErr').textContent=`Enter a birth year between 1880 and ${yr}.`;$('#aBorn').focus();return;}
 const base=addFor,bp=P[base];
 if(rel==='child'&&born<bp.born+12){$('#aErr').textContent=`That’s too close to ${first(base)}’s birth year (${bp.born}).`;return;}
 let photo=null;const f=$('#aPhoto').files[0];
 if(f)photo=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f);});
 const id=(fn+ln+Date.now()).toLowerCase().replace(/[^a-z0-9]/g,'');
 const np={name:(fn+' '+ln).trim(),g:$('#aG').value,born,place:$('#aPlace').value.trim()||bp.place,parents:[],photo,joined:false,bio:''};
 if(rel==='child')np.parents=[base,bp.spouse].filter(Boolean);
 if(rel==='sibling')np.parents=[...bp.parents];
 if(rel==='spouse'){np.spouse=base;bp.spouse=id;}
 P[id]=np;buildGroups();
 $('#modal').classList.remove('on');
 S.collapsed.delete(base);
 if(S.view==='list')renderList();else render();
 populateViewer();select(id);toast(`${fn} added to the tree`);
});

/* ---------- search ---------- */
let hi=-1;
function suggest(){
 const q=$('#q').value.trim().toLowerCase(),box=$('#sugg');
 if(!q){box.style.display='none';return;}
 const res=Object.keys(P).filter(id=>P[id].name.toLowerCase().includes(q)).slice(0,6);hi=res.length?0:-1;
 box.innerHTML=res.map((id,i)=>`<button data-id="${id}" class="${i===0?'hi':''}">${avatar(id)}<span><b style="font-weight:500">${esc(P[id].name)}</b><br><small style="color:var(--muted)">${esc(relation(S.viewer,id))}</small></span></button>`).join('')||'<div style="padding:10px;color:var(--muted);font-size:14px">No one by that name</div>';
 box.style.display='block';
}
function pick(id){$('#q').value='';$('#sugg').style.display='none';select(id);if(S.view==='list'){const el=document.querySelector(`.card[data-id="${id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'});}}
$('#q').addEventListener('input',suggest);
$('#q').addEventListener('keydown',e=>{const bs=[...$('#sugg').querySelectorAll('button')];if(!bs.length)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('hi',i===hi));}
 if(e.key==='Enter'){e.preventDefault();pick(bs[Math.max(hi,0)].dataset.id);}});
$('#sugg').addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();pick(b.dataset.id);}});
$('#q').addEventListener('blur',()=>setTimeout(()=>$('#sugg').style.display='none',100));

/* ---------- controls ---------- */
function setView(v){
 S.view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
 const list=v==='list';$('#list').style.display=list?'block':'none';$('#svg').style.display=list?'none':'block';
 $('#zoomCtl').style.display=list?'none':'flex';$('#meBtn').style.display=list?'none':'inline-flex';
 if(list)renderList();else render(true);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function populateViewer(){$('#viewer').innerHTML=Object.keys(P).filter(id=>P[id].joined).map(id=>`<option value="${id}"${id===S.viewer?' selected':''}>${esc(P[id].name)}</option>`).join('');}
$('#viewer').onchange=e=>{S.viewer=e.target.value;closeDrawer();closePanel();updateBadge();S.view==='list'?renderList():render(true);toast(`Now viewing as ${first(S.viewer)}`);};
$('#season').onchange=e=>{S.season=e.target.value;if(S.view==='tree'){const t=d3.zoomTransform(svg.node());render();svg.call(zoom.transform,t);}};
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;try{localStorage.setItem('roots-theme',S.theme);}catch(e){}};
$('#focusBtn').onclick=()=>{S.focus=!S.focus;$('#focusBtn').classList.toggle('on',S.focus);$('#focusBtn').setAttribute('aria-pressed',S.focus);S.view==='list'?renderList():render(true);};
$('#meBtn').onclick=()=>centerOn(S.viewer,1.15);
$('#zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.3);
$('#zout').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.3);
$('#zfit').onclick=()=>fitView();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))$('#modal').classList.remove('on');else if($('#drawer').classList.contains('open'))closeDrawer();else closePanel();}});
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(()=>S.view!=='list'&&fitView(false),200);});

populateViewer();updateBadge();render(true);
</script>
</body>
</html>
